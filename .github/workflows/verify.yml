name: Verify source

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"

      - name: Install runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk poppler-utils

      - name: Install offline OCR dependencies
        run: npm ci

      - name: Fetch the same bundled CJK font used by release packages
        run: |
          node scripts/fetch-release-assets.mjs --fonts
          echo "PDF_FONT_PATH=$GITHUB_WORKSPACE/verification/release-assets/NotoSansCJKsc-VF.ttf" >> "$GITHUB_ENV"

      - name: Verify implementation
        run: npm run check

      - name: Run automated tests
        run: npm test
